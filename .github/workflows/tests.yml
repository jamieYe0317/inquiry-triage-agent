name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check src tests eval scripts
      - run: uv run pytest -q
      - run: uv run python eval/run_eval.py --mode offline --split test --tag ci
