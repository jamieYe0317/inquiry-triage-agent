[project]
name = "inquiry-triage-agent"
version = "0.1.0"
description = "Sorts customer inquiries for a fictional equipment distributor, looks up the right docs, drafts a case, and hands it to the right team. Synthetic data only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75",
    "langgraph>=0.6,<1.1",
    "pydantic>=2.8",
    "rank-bm25>=0.2.2",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E501", "UP042"]
